networks: 
    apache:
        name: apache
        driver: bridge

services:

  app:
    image: likesistemas/php:latest
    container_name: apache_app
    environment:
      - PHP_NAME=apache_app
    volumes:
      - ./www/:/var/www/public/
    networks:
      - apache

  apache:
    image: likesistemas/apache:dev
    build: .
    container_name: apache_apache
    environment:
      - HOST_PHP=apache_app
      - PORTA_PHP=9000
      - SSL=true
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./www/:/var/www/public/
    depends_on:
      - app
    networks:
      - apache
